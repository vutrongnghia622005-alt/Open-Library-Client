services:
  - type: web
    name: open-library-client-api
    runtime: python
    plan: free
    region: singapore
    branch: deploy-backend
    rootDir: backend
    buildCommand: pip install -r requirements.lock
    startCommand: alembic upgrade head && python -m scripts.import_catalog && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /ready
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: open-library-client-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: OPEN_LIBRARY_USER_AGENT
        sync: false

databases:
  - name: open-library-client-db
    plan: free
    region: singapore
    databaseName: openlibrary
    user: openlibrary
    ipAllowList: []
